name: Publish Learning Guide

# The learning guide's markdown source is local-only, so CI does NOT regenerate the
# HTML. It validates the committed, self-contained HTML and publishes it to GitHub
# Pages. Freshness (HTML matches source) is enforced locally by .githooks/pre-commit.
on:
  push:
    branches: [main]
    paths:
      - docs/learning-guide.html
      - .github/workflows/publish-learning-guide.yml
      - scripts/docgen/check-published-html.sh
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate the published HTML is self-contained
        run: bash scripts/docgen/check-published-html.sh docs/learning-guide.html

      - name: Assemble the Pages site
        run: |
          mkdir -p _site
          cp docs/learning-guide.html _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
